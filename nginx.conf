# www redirects to the apex so the OAuth redirect origin is always https://remanso.at/.
# client-metadata.json lists the apex only, and www.remanso.at is a different origin.
server {
    listen 80;
    server_name www.remanso.at;
    return 301 https://remanso.at$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Set explicitly rather than relying on mime.types, so an auth failure is never
    # traced back to a wrong content type on the OAuth client metadata.
    location = /client-metadata.json {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
